<!DOCTYPE html>
<html lang="en">
<head>

    <title>Exercise 15 — Responsive Card Layout</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="page-container">
        <h1>Responsive Card Layout</h1>
<p>Cards appear in a row on desktop and stack vertically on mobile screens.</p>
<div class="responsive-cards">
    <article class="responsive-card"><h2>Alex</h2><p>Frontend Developer</p></article>
    <article class="responsive-card"><h2>Sam</h2><p>UI Designer</p></article>
    <article class="responsive-card"><h2>Taylor</h2><p>Student</p></article>
</div>
    </main>
</body>
